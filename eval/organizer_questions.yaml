- id: organizer_q1
  scenario: organizer
  dataset: hk_medicines_v1
  question: Какое лекарство сильнее всего выросло в процентах по среднедневным продажам на аптеку в марте 2025 к февралю,
    включая дни без продаж? Пришли расчёт.
  expect:
    outcome: answer
    tools_any:
    - run_sql
    facts:
    - key: medicine.id
      comparison: exact
      value: '1019'
    - key: medicine.growth_percent
      comparison: approx
      value: 30.3211
      unit: процент
      abs_tolerance: 0.01
- id: organizer_q2
  scenario: organizer
  dataset: hk_sales_v1
  question: В каком городе сильнее всего выросла чистая выручка в процентах в марте 2025 к февралю с учётом количества, скидок
    и возвратов?
  expect:
    outcome: answer
    tools_any:
    - run_sql
    facts:
    - key: city
      comparison: exact
      value: Калининград
    - key: city.growth_percent
      comparison: approx
      value: 62.29
      unit: процент
      abs_tolerance: 0.01
- id: organizer_q3
  scenario: organizer
  dataset: hk_support_v1
  question: У какой группы максимальный 90-й перцентиль времени решения среди обращений, закрытых в марте 2025? Исключи группы
    с менее чем 100 закрытиями.
  expect:
    outcome: answer
    tools_any:
    - run_sql
    facts:
    - key: group
      comparison: exact
      value: Доставка заказов
    - key: group.p90_hours
      comparison: approx
      value: 72.555
      unit: часы, quantile_cont или quantile_disc
      abs_tolerance: 0.07
- id: organizer_q4
  scenario: organizer
  dataset: hk_delivery_v1
  question: У какого перевозчика максимальный 95-й перцентиль задержки среди доставленных в марте 2025 отправлений? Доставку
    вовремя считай нулевой задержкой.
  expect:
    outcome: answer
    tools_any:
    - run_sql
    facts:
    - key: carrier
      comparison: exact
      value: Собственная доставка
    - key: carrier.p95_hours
      comparison: approx
      value: 23.195
      unit: часы, quantile_cont или quantile_disc
      abs_tolerance: 0.05

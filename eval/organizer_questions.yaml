- id: organizer_q6
  scenario: organizer
  dataset: hk_background_jobs_v1
  question: Для каждого задания рассчитай долю цепочек, завершившихся успешно только после повторных попыток, и среднее число
    попыток в таких цепочках.
  expect:
    outcome: answer
    tools_any:
    - run_sql
    facts:
    - key: cleanup.retried_chains
      comparison: exact
      value: 581
    - key: cleanup.avg_attempts
      comparison: approx
      value: 2.3201
      unit: попытки
      abs_tolerance: 0.001
    - key: archive.retried_chains
      comparison: exact
      value: 337
    - key: archive.avg_attempts
      comparison: approx
      value: 2.279
      unit: попытки
      abs_tolerance: 0.001

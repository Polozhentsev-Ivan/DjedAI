- id: organizer_q1
  scenario: organizer
  dataset: hk_medicines_v1
  question: Какое лекарство сильнее всего выросло в процентах по среднедневным продажам на аптеку в марте
    2025 к февралю, включая дни без продаж? Пришли расчёт.
  expect:
    outcome: answer
    tools_any:
    - run_sql
    facts:
    - key: medicine.growth_percent
      comparison: approx
      value: 30.3211
      unit: процент
      abs_tolerance: 0.01
    - key: medicine.id
      comparison: exact
      value: '1019'
    - key: medicine.feb_daily_per_pharmacy
      comparison: approx
      value: 1.5464285714285715
      abs_tolerance: 0.005
    - key: medicine.mar_daily_per_pharmacy
      comparison: approx
      value: 2.015322580645161
      abs_tolerance: 0.005
    answer_contains_value:
      from_result: true
    answer_units:
    - '%|процент'
    answer_rows:
    - label: Цетиризин
      values:
      - value: 30.3211
        abs_tolerance: 0.01
        unit: percent
- id: organizer_q2
  scenario: organizer
  dataset: hk_sales_v1
  question: В каком городе сильнее всего выросла чистая выручка в процентах в марте 2025 к февралю с учётом
    количества, скидок и возвратов?
  expect:
    outcome: answer
    tools_any:
    - run_sql
    facts:
    - key: city
      comparison: exact
      value: Калининград
    - key: city.growth_percent
      comparison: approx
      value: 62.29
      unit: процент
      abs_tolerance: 0.01
    answer_contains_value:
      from_result: true
    answer_units:
    - '%|процент'
    answer_rows:
    - label: Калининград
      values:
      - value: 62.29
        abs_tolerance: 0.01
        unit: percent
- id: organizer_q3
  scenario: organizer
  dataset: hk_support_v1
  question: У какой группы максимальный 90-й перцентиль времени решения среди обращений, закрытых в марте
    2025? Исключи группы с менее чем 100 закрытиями.
  expect:
    outcome: answer
    tools_any:
    - run_sql
    facts:
    - key: group
      comparison: exact
      value: Доставка заказов
    - key: group.p90_hours
      comparison: approx
      value: 72.555
      unit: часы, quantile_cont или quantile_disc
      abs_tolerance: 0.07
    answer_contains_value:
      from_result: true
    answer_units:
    - \b(?:ч\.?|час\w*)\b
    answer_rows:
    - label: Доставка заказов
      values:
      - value: 72.555
        abs_tolerance: 0.07
        unit: hours
    result_duration_unit: hours

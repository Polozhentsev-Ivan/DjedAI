- id: s9_planned_processed_pearson_01
  scenario: 9
  dataset: hk_background_jobs_v1
  question: Посчитай корреляцию Пирсона между «Записей к обработке» и «Обработано записей» на уровне отдельных попыток
    всего файла. Включи нули, используй только полные пары, округли r до четырёх знаков. Что эта связь позволяет
    и не позволяет утверждать?
  expect:
    outcome: answer
    tools_any:
    - run_sql
    tools_planned:
    - correlation
    requirements:
    - correlation
    population: complete_measure_pairs
    facts:
    - key: correlation.planned_processed
      comparison: approx
      value: 0.984979668417095
      unit: коэффициент Пирсона r, безразмерный
      abs_tolerance: 5.0e-05
    must_explain:
    - Одна пара — одна попытка; использованы все 500000 полных пар без группировки и удаления нулей.
    - Сильная линейная связь не доказывает причинный эффект или независимость наблюдений; счётчики относятся к одной
      попытке.
    must_not_claim:
    - r рассчитан по сервисным средним вместо попыток.
    - Корреляция доказывает, что изменение плана вызовет заданное изменение факта.
    answer_contains_value:
      from_result: true
- id: s9_daily_counts_errors_01
  scenario: 9
  dataset: hk_background_jobs_v1
  question: Собери по календарным дням начала МСК число всех попыток и число попыток со статусом «Ошибка». Посчитай
    Pearson дневных рядов при нулевом лаге, одинаковом весе дней и нулях на пропущенных датах. Округли r до четырёх
    знаков; поясни ограничение связи «часть–целое».
  expect:
    outcome: answer
    tools_any:
    - run_sql
    tools_planned:
    - time_aggregate
    - correlation
    requirements:
    - correlation
    population: calendar_attempt_rows
    facts:
    - key: correlation.daily_attempts_errors
      comparison: approx
      value: 0.5386958876895899
      unit: коэффициент Пирсона r между дневными counts
      abs_tolerance: 5.0e-05
    must_explain:
    - Использована непрерывная сетка из 730 дней; каждая пара — дневные counts, не исходная попытка.
    - Ошибки являются частью общего count; положительная связь не доказывает влияние нагрузки на риск.
    must_not_claim:
    - r рассчитан по долям ошибок вместо числа ошибок.
    - Дни взвешены числом запусков или пропуски сдвинуты вместо заполнения нулями.
    answer_contains_value:
      from_result: true
- id: s9_daily_lag_search_01
  scenario: 9
  dataset: hk_background_jobs_v1
  question: Проверь, предшествует ли число попыток росту числа ошибок. На дневных рядах МСК вычисли Pearson для
    attempts[t] и errors[t+5], затем найди максимум по модулю среди целых лагов −7…+7 дней. При равенстве выбирай
    меньший модуль лага, затем меньший лаг. Используй только пересекающиеся даты. Назови r для +5, лучший лаг и
    его r; не подменяй связь доказательством причины.
  expect:
    outcome: answer
    tools_any:
    - run_sql
    tools_planned:
    - time_aggregate
    - lagged_correlation
    requirements:
    - correlation
    population: calendar_attempt_rows
    facts:
    - key: lag.plus5_r
      comparison: approx
      value: -0.0067572980019233765
      unit: коэффициент Пирсона r при лаге +5 дней
      abs_tolerance: 5.0e-05
    - key: lag.best_days
      comparison: exact
      value: 0
      unit: календарные дни лага errors относительно attempts
    - key: lag.best_r
      comparison: approx
      value: 0.5386958876895899
      unit: коэффициент Пирсона r при лучшем по модулю лаге
      abs_tolerance: 5.0e-05
    must_explain:
    - Положительный k означает, что attempts[t] предшествует errors[t+k]; при +5 остаётся 725 пар.
    - Сетка календарная с нулями counts; нет циклического сдвига или дополнения краёв.
    - 'Порядок выбора: |r| DESC, |k| ASC, k ASC; максимум при нуле не подтверждает опережение.'
    - Корреляция и лаг не доказывают причинность.
    must_not_claim:
    - Направление лага обращено.
    - Объявлена статистическая значимость сканирования лагов без проверки.
    answer_contains_value:
      from_result: true

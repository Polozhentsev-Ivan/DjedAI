- id: s3_duplicates_chains_01
  scenario: 3
  dataset: hk_background_jobs_v1
  question: Есть ли в полном файле полностью одинаковые строки? Посчитай лишние копии сверх первой и отдельно число
    непустых кодов цепочки, встречающихся более одного раза. Объясни разницу между дублем строки и повторной попыткой.
  expect:
    outcome: answer
    tools_any:
    - run_sql

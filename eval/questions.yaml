- id: s3_duration_extremes_01
  scenario: 3
  dataset: hk_background_jobs_v1
  question: 'Найди минимум, максимум и среднюю длительность попытки в секундах как окончание минус начало МСК. Отдельно
    посчитай подозрительно долгие попытки: строго дольше 3600 секунд. Порог задан мной; не называй его автоматически
    статистическим критерием аномальности.'
  expect:
    outcome: answer
    tools_any:
    - run_sql
    population: complete_duration_attempt_rows
    facts:
    - key: duration.min_seconds
      comparison: exact
      value: 1
      unit: секунды
    - key: duration.max_seconds
      comparison: exact
      value: 6542
      unit: секунды
    - key: duration.mean_seconds
      comparison: approx
      value: 142.122136
      unit: секунды
      abs_tolerance: 0.005
    - key: duration.over_3600_count
      comparison: exact
      value: 5
      unit: попытки с длительностью строго больше 3600 секунд
    must_explain:
    - Длительность — разность окончания и начала одной попытки; среднее рассчитано по допустимым попыткам с обеими
      датами.
    - Отбор подозрительно долгих попыток использует строгое условие duration > 3600 секунд.
    - Это проверка заданного порога; статистическая аномальность или причина длительности этим не доказана.
    must_not_claim:
    - Граница 3600 включена в условие или секунды заменены числом записей.
    - Пользовательский порог выдан за доказательство статистической аномалии.

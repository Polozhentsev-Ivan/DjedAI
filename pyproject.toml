[project]
name = "djedai"
version = "0.0.0"
description = "Локальная аналитическая платформа: вопросы к данным на русском языке"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13.16,<3.14"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.4",
    "alembic==1.15.1",
    "argon2-cffi==25.1.0",
    "charset-normalizer==3.5.2",
    "duckdb==1.5.6",
    "fastapi==0.143.0",
    "langgraph==1.2.16",
    "openai==3.31.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.8.1",
    "sqlalchemy==2.0.38",
    "python-dotenv==1.2.4",
    "sqlglot==30.23.0",
    "starlette==1.7.0",
    "uvicorn==0.34.0",
    "python-multipart==0.0.32",
    "cryptography==50.0.2",
    "statsmodels==0.15.0",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pytest-xdist==3.8.0",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: проверки с реальным DuckDB, БД или API",
    "llm: проверки с реальной языковой моделью",
]

[tool.coverage.run]
source = ["src/djedai"]

[tool.ruff]
line-length = 100
target-version = "py313"
# документация содержит примеры-наброски, их ruff не форматирует
extend-exclude = ["docs", "README.md", "**/README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

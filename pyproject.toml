[project]
name = "djedai"
version = "0.0.0"
description = "Локальная аналитическая платформа: вопросы к данным на русском языке"
readme = "README.md"
requires-python = ">=3.13.16,<3.14"
dependencies = [
    "charset-normalizer==3.5.2",
    "duckdb==1.5.6",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock>=3.17.0",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: проверки с реальным DuckDB, БД или API",
    "llm: проверки с реальной языковой моделью",
]

[tool.coverage.run]
source = ["src/djedai"]

[tool.ruff]
line-length = 100
target-version = "py313"
# документация содержит примеры-наброски, их ruff не форматирует
extend-exclude = ["docs", "README.md", "**/README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

openapi: 3.1.0
info:
  title: DjedAI API (snapshot)
  version: 0.1.0
  description: |
    Agreed snapshot of the backend API for the frontend (#83), assembled from
    docs/specification.md: §3.4 DatasetCatalog, §4.3 ToolResult, §5.6 AssistantMessage,
    §6.2 ChartSpec, §7.2 Dashboard and §7.3 API. TypeScript types are generated from it
    with `npm run gen:types`; once FastAPI (#92) publishes /openapi.json this file is
    replaced by that export.

    Items marked «x-proposal» are not in the specification yet and are proposed for #92.

    Server-sent events are described as schemas: every SSE frame is
    `event: <name>` + `data: <JSON of the matching schema>`.
servers:
  - url: /api
paths:
  /datasets:
    get:
      operationId: listDatasets
      summary: Datasets of the current user
      responses:
        '200':
          description: Datasets, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DatasetSummary' }
        default: { $ref: '#/components/responses/Error' }
  /datasets/upload:
    post:
      operationId: uploadCsv
      summary: Upload one or more CSV files; profiling runs in the background
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '202':
          description: Accepted; follow /datasets/{dataset_id}/events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetAccepted' }
        default: { $ref: '#/components/responses/Error' }
  /datasets/connect:
    post:
      operationId: connectDatabase
      summary: Connect PostgreSQL or ClickHouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectRequest' }
      responses:
        '202':
          description: Accepted; follow /datasets/{dataset_id}/events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetAccepted' }
        default: { $ref: '#/components/responses/Error' }
  /datasets/{dataset_id}:
    parameters:
      - { name: dataset_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDataset
      summary: Status and catalog of a dataset
      responses:
        '200':
          description: Dataset with its catalog once profiling is done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetDetail' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteDataset
      summary: Delete a dataset
      x-proposal: true
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /datasets/{dataset_id}/events:
    parameters:
      - { name: dataset_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: datasetEvents
      summary: SSE progress of profiling (progress, done, error)
      responses:
        '200':
          description: Event stream; see ProfilingEvent
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/ProfilingEvent' }
  /chats:
    get:
      operationId: listChats
      parameters:
        - { name: dataset_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Chats of a dataset, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatSummary' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id]
              properties:
                dataset_id: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [chat_id]
                properties:
                  chat_id: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /chats/{chat_id}:
    parameters:
      - { name: chat_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getChat
      responses:
        '200':
          description: Chat with its messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatDetail' }
        default: { $ref: '#/components/responses/Error' }
  /chats/{chat_id}/messages:
    parameters:
      - { name: chat_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendMessage
      summary: Ask a question; the answer streams as SSE. The client never repeats this POST on its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1 }
      responses:
        '200':
          description: Event stream; see AgentEvent
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/AgentEvent' }
        default: { $ref: '#/components/responses/Error' }
  /results/{result_id}:
    parameters:
      - { name: result_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getResult
      summary: ToolResult metadata without rows
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolResultMeta' }
        default: { $ref: '#/components/responses/Error' }
  /results/{result_id}/data:
    parameters:
      - { name: result_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getResultData
      responses:
        '200':
          description: Columns and rows for rendering
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultData' }
        default: { $ref: '#/components/responses/Error' }
  /dashboards:
    get:
      operationId: listDashboards
      parameters:
        - { name: dataset_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Dashboards of a dataset
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DashboardSummary' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: saveToDashboard
      summary: Create a dashboard or add a chart to an existing one («+ В дашборд»)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardCreate' }
      responses:
        '200':
          description: Saved dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }
  /dashboards/{dashboard_id}:
    parameters:
      - { name: dashboard_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDashboard
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateDashboard
      summary: Rename, change layout or remove widgets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardPatch' }
      responses:
        '200':
          description: Updated dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }
  /dashboards/{dashboard_id}/refresh:
    parameters:
      - { name: dashboard_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: refreshDashboard
      summary: Re-run every widget's tool_call; widgets get new result_id
      responses:
        '200':
          description: Refreshed dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Error with a user-facing message
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorBody:
      type: object
      description: Same shape as ToolError (src/djedai/contracts/tool_result.py)
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        suggestion: { type: [string, 'null'] }
    ErrorResponse:
      type: object
      x-proposal: true
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }

    SourceKind:
      type: string
      enum: [csv_upload, postgres, clickhouse]
    DatasetStatus:
      type: string
      enum: [processing, ready, error]
    DatasetSource:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/SourceKind' }
        files: { type: integer, description: Number of uploaded CSV files, x-proposal: true }
    DatasetSummary:
      type: object
      description: Row of the «Ваши датасеты» table (x-proposal; the specification lists only the storage fields)
      required: [dataset_id, name, source, status, table_count, row_count, created_at]
      properties:
        dataset_id: { type: string }
        name: { type: string }
        source: { $ref: '#/components/schemas/DatasetSource' }
        status: { $ref: '#/components/schemas/DatasetStatus' }
        table_count: { type: [integer, 'null'] }
        row_count: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }
    DatasetDetail:
      allOf:
        - $ref: '#/components/schemas/DatasetSummary'
        - type: object
          required: [catalog, error]
          properties:
            catalog:
              oneOf:
                - $ref: '#/components/schemas/DatasetCatalog'
                - type: 'null'
            error:
              oneOf:
                - $ref: '#/components/schemas/ErrorBody'
                - type: 'null'
    DatasetAccepted:
      type: object
      required: [dataset_id, status]
      properties:
        dataset_id: { type: string }
        status: { $ref: '#/components/schemas/DatasetStatus' }
    ConnectRequest:
      type: object
      required: [kind, dsn]
      properties:
        kind: { type: string, enum: [postgres, clickhouse] }
        dsn: { type: string }
        tables:
          type: array
          items: { type: string }

    SemanticType:
      type: string
      enum: [id, integer, float, money, percent, datetime, date, category, text, bool]
    CatalogColumn:
      type: object
      required: [name, original_name, physical_type, semantic_type, null_ratio, distinct_count, is_unique]
      properties:
        name: { type: string }
        original_name: { type: string }
        physical_type: { type: string }
        semantic_type: { $ref: '#/components/schemas/SemanticType' }
        role: { type: string, enum: [id, measure, dimension, time, text] }
        null_ratio: { type: number }
        distinct_count: { type: integer }
        is_unique: { type: boolean }
        currency: { type: [string, 'null'], description: 'Currency sign of money columns, e.g. ₽', x-proposal: true }
        parse:
          type: object
          properties:
            format: { type: [string, 'null'] }
            success_ratio: { type: number }
        description: { type: [string, 'null'] }
    CatalogTable:
      type: object
      required: [table_id, original_name, row_count, columns]
      properties:
        table_id: { type: string }
        raw_table: { type: string }
        original_name: { type: string }
        description: { type: [string, 'null'] }
        row_count: { type: integer }
        primary_key_candidates: { type: array, items: { type: string } }
        time_columns: { type: array, items: { type: string } }
        duplicate_rows: { type: integer }
        columns:
          type: array
          items: { $ref: '#/components/schemas/CatalogColumn' }
    ColumnRef:
      type: object
      required: [table, column]
      properties:
        table: { type: string }
        column: { type: string }
    Relation:
      type: object
      required: [from, to, overlap, cardinality, confidence]
      properties:
        from: { $ref: '#/components/schemas/ColumnRef' }
        to: { $ref: '#/components/schemas/ColumnRef' }
        overlap: { type: number, description: 'Share of matched keys, 0..1' }
        jaccard: { type: number }
        cardinality: { type: string, enum: ['1:1', 'N:1', '1:N', 'N:N'] }
        confidence: { type: string, enum: [high, medium, low] }
    Transformation:
      type: object
      required: [table, action, detail]
      properties:
        table: { type: string }
        column: { type: [string, 'null'] }
        action: { type: string }
        detail: { type: string }
    DatasetCatalog:
      type: object
      required: [dataset_id, name, created_at, source, tables, relations, warnings, transformations]
      properties:
        dataset_id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/DatasetSource' }
        summary: { type: [string, 'null'] }
        tables:
          type: array
          items: { $ref: '#/components/schemas/CatalogTable' }
        relations:
          type: array
          items: { $ref: '#/components/schemas/Relation' }
        warnings: { type: array, items: { type: string } }
        transformations:
          type: array
          items: { $ref: '#/components/schemas/Transformation' }

    ProfilingStep:
      type: string
      enum: [read, types, profile]
    ProfilingProgress:
      type: object
      description: 'SSE `event: progress`'
      required: [step, status]
      properties:
        step: { $ref: '#/components/schemas/ProfilingStep' }
        status: { type: string, enum: [active, done] }
        pct: { type: integer, minimum: 0, maximum: 100 }
        file: { type: string }
    ProfilingDone:
      type: object
      description: 'SSE `event: done`'
      required: [dataset_id]
      properties:
        dataset_id: { type: string }
    ProfilingEvent:
      description: 'Events of /datasets/{id}/events: progress → ProfilingProgress, done → ProfilingDone, error → ErrorBody'
      oneOf:
        - $ref: '#/components/schemas/ProfilingProgress'
        - $ref: '#/components/schemas/ProfilingDone'
        - $ref: '#/components/schemas/ErrorBody'

    ChartAxis:
      type: object
      required: [field]
      properties:
        field: { type: string }
        label: { type: string }
        kind: { type: string, enum: [time, category, number] }
    ChartMeasure:
      type: object
      required: [field]
      properties:
        field: { type: string }
        label: { type: string }
        format: { type: string, enum: [number, money, percent, int] }
    ChartSpec:
      type: object
      required: [type, title]
      properties:
        chart_id: { type: string }
        result_id: { type: string, description: 'Rows come from /results/{result_id}/data' }
        type: { type: string, enum: [bar, line, area, scatter, pie, histogram, heatmap, box, table, kpi] }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        x: { $ref: '#/components/schemas/ChartAxis' }
        y:
          type: array
          items: { $ref: '#/components/schemas/ChartMeasure' }
        color:
          type: object
          properties:
            field: { type: string }
            label: { type: string }
        orientation: { type: string, enum: [vertical, horizontal] }
        stacked: { type: boolean }
        sort:
          type: object
          properties:
            field: { type: string }
            order: { type: string, enum: [asc, desc] }
        limit: { type: integer }
        annotations:
          type: array
          items:
            type: object
            properties:
              x: { type: [string, number] }
              text: { type: string }

    Fact:
      type: object
      required: [text]
      properties:
        text: { type: string }
        kind: { type: string }
        values: { type: object, additionalProperties: true }
    ResultColumn:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }
        label: { type: string }
    ResultData:
      type: object
      required: [columns, rows, row_count, truncated]
      properties:
        columns:
          type: array
          items: { $ref: '#/components/schemas/ResultColumn' }
        rows:
          type: array
          items:
            type: array
            items: { type: [string, number, boolean, 'null'] }
        row_count: { type: integer }
        truncated: { type: boolean }
    ToolResultMeta:
      type: object
      required: [result_id, tool, params, status, facts]
      properties:
        result_id: { type: string }
        chat_id: { type: [string, 'null'] }
        tool: { type: string }
        params: { type: object, additionalProperties: true }
        sql: { type: [string, 'null'] }
        status: { type: string, enum: [ok, error, empty] }
        columns:
          type: array
          description: Columns of the data, without rows
          items: { $ref: '#/components/schemas/ResultColumn' }
        row_count: { type: integer }
        facts:
          type: array
          items: { $ref: '#/components/schemas/Fact' }
        chart_hint: { type: [object, 'null'], additionalProperties: true }
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorBody'
            - type: 'null'
        created_at: { type: string, format: date-time }
        duration_ms: { type: integer }

    TextBlock:
      type: object
      required: [type, markdown]
      properties:
        type: { const: text }
        markdown: { type: string }
    ChartBlock:
      type: object
      required: [type, chart]
      properties:
        type: { const: chart }
        chart: { $ref: '#/components/schemas/ChartSpec' }
    TableBlock:
      type: object
      required: [type, result_id]
      properties:
        type: { const: table }
        result_id: { type: string }
        columns: { type: array, items: { type: string } }
        limit: { type: integer }
    ClarificationBlock:
      type: object
      required: [type, question, options]
      properties:
        type: { const: clarification }
        question: { type: string }
        options: { type: array, items: { type: string } }
    DashboardLinkBlock:
      type: object
      required: [type, dashboard_id, title]
      properties:
        type: { const: dashboard_link }
        dashboard_id: { type: string }
        title: { type: string }
    SuggestionsBlock:
      type: object
      required: [type, items]
      properties:
        type: { const: suggestions }
        items: { type: array, items: { type: string } }
    Block:
      oneOf:
        - $ref: '#/components/schemas/TextBlock'
        - $ref: '#/components/schemas/ChartBlock'
        - $ref: '#/components/schemas/TableBlock'
        - $ref: '#/components/schemas/ClarificationBlock'
        - $ref: '#/components/schemas/DashboardLinkBlock'
        - $ref: '#/components/schemas/SuggestionsBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextBlock'
          chart: '#/components/schemas/ChartBlock'
          table: '#/components/schemas/TableBlock'
          clarification: '#/components/schemas/ClarificationBlock'
          dashboard_link: '#/components/schemas/DashboardLinkBlock'
          suggestions: '#/components/schemas/SuggestionsBlock'
    ChatSummary:
      type: object
      required: [chat_id, dataset_id, title, created_at]
      properties:
        chat_id: { type: string }
        dataset_id: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [message_id, role, created_at]
      properties:
        message_id: { type: string }
        role: { type: string, enum: [user, assistant] }
        created_at: { type: string, format: date-time }
        text: { type: string, description: User question }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/Block' }
        result_ids: { type: array, items: { type: string } }
    ChatDetail:
      allOf:
        - $ref: '#/components/schemas/ChatSummary'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/ChatMessage' }

    AgentStatus:
      type: object
      description: 'SSE `event: status` — agent step shown while streaming'
      required: [node, text]
      properties:
        node: { type: string }
        text: { type: string }
    AgentToolCall:
      type: object
      description: 'SSE `event: tool_call`'
      required: [tool, params]
      properties:
        tool: { type: string }
        params: { type: object, additionalProperties: true }
    AgentToolResult:
      type: object
      description: 'SSE `event: tool_result`'
      required: [result_id, status]
      properties:
        result_id: { type: string }
        status: { type: string, enum: [ok, error, empty] }
    AgentDone:
      type: object
      description: 'SSE `event: done`'
      required: [message_id]
      properties:
        message_id: { type: string }
    AgentEvent:
      description: 'Events of POST /chats/{id}/messages: status, tool_call, tool_result, block (Block), done, error (ErrorBody)'
      oneOf:
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolCall'
        - $ref: '#/components/schemas/AgentToolResult'
        - $ref: '#/components/schemas/Block'
        - $ref: '#/components/schemas/AgentDone'
        - $ref: '#/components/schemas/ErrorBody'

    ToolCall:
      type: object
      required: [tool, params]
      properties:
        tool: { type: string }
        params: { type: object, additionalProperties: true }
    WidgetLayout:
      type: object
      required: [x, y, w, h]
      properties:
        x: { type: integer }
        y: { type: integer }
        w: { type: integer }
        h: { type: integer }
    Widget:
      type: object
      required: [widget_id, tool_call, chart, result_id, status]
      properties:
        widget_id: { type: string }
        tool_call: { $ref: '#/components/schemas/ToolCall' }
        chart: { $ref: '#/components/schemas/ChartSpec' }
        caption: { type: [string, 'null'] }
        layout: { $ref: '#/components/schemas/WidgetLayout' }
        result_id:
          type: [string, 'null']
          description: Result of the latest run; null until the widget has run
          x-proposal: true
        status:
          type: string
          enum: [ok, error, empty]
          description: Outcome of the latest run, so one failed widget does not fail the dashboard
          x-proposal: true
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorBody'
            - type: 'null'
          x-proposal: true
    DashboardSummary:
      type: object
      required: [dashboard_id, dataset_id, title]
      properties:
        dashboard_id: { type: string }
        dataset_id: { type: string }
        title: { type: string }
        refreshed_at: { type: [string, 'null'], format: date-time }
    Dashboard:
      type: object
      required: [dashboard_id, dataset_id, title, widgets, created_at]
      properties:
        dashboard_id: { type: string }
        dataset_id: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        source_chat_id: { type: [string, 'null'] }
        widgets:
          type: array
          items: { $ref: '#/components/schemas/Widget' }
        created_at: { type: string, format: date-time }
        refreshed_at: { type: [string, 'null'], format: date-time }
    DashboardCreate:
      type: object
      required: [dataset_id, result_id, chart]
      properties:
        dataset_id: { type: string }
        dashboard_id: { type: string, description: Existing dashboard to add to; a new one is created when omitted }
        title: { type: string }
        result_id: { type: string }
        chart: { $ref: '#/components/schemas/ChartSpec' }
    DashboardPatch:
      type: object
      properties:
        title: { type: string }
        remove_widget_ids: { type: array, items: { type: string } }
        layout:
          type: object
          additionalProperties: { $ref: '#/components/schemas/WidgetLayout' }

openapi: 3.1.0
info:
  title: DjedAI API (snapshot)
  version: 0.2.0
  description: |
    Agreed PL-1 API snapshot plus canonical shared contracts, based on
    docs/specification.md: §3.4 DatasetCatalog, §4.3 ToolResult, §5.6 AssistantMessage,
    §6.2 ChartSpec, §7.2 Dashboard and §7.3 API. TypeScript types are generated from it
    with `npm run gen:types`. Shared definitions are referenced from contracts.json,
    exported from the current Python backend by scripts/export_frontend_contracts.py.
    Implementations are tracked in the feature issues linked from the PL-1 decision record.

    PL-1 decisions and implementation boundaries are in docs/decisions/47-contracts-and-runtime.md.

    Server-sent events are described as schemas: every SSE frame is
    `event: <name>` + `data: <JSON of the matching schema>`.
servers:
  - url: /api
paths:
  /auth/register:
    post:
      operationId: register
      summary: Create a local account without logging in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Public user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRead' }
        default: { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      summary: Create a revocable 24-hour Bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserLogin' }
      responses:
        '200':
          description: Token returned once, never cached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      operationId: currentUser
      security: [{ BearerSession: [] }]
      responses:
        '200':
          description: Public profile of the verified session owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRead' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      security: [{ BearerSession: [] }]
      responses:
        '204': { description: Current session revoked }
        default: { $ref: '#/components/responses/Error' }
  /datasets:
    get:
      operationId: listDatasets
      summary: Datasets of the current user
      responses:
        '200':
          description: Datasets, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DatasetSummary' }
        default: { $ref: '#/components/responses/Error' }
  /datasets/upload:
    post:
      operationId: uploadCsv
      summary: Upload one or more CSV files; profiling runs in the background
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '202':
          description: Accepted; follow /datasets/{dataset_id}/events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetAccepted' }
        default: { $ref: '#/components/responses/Error' }
  /datasets/connect:
    post:
      operationId: connectDatabase
      summary: Connect PostgreSQL or ClickHouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectRequest' }
      responses:
        '202':
          description: Accepted; follow /datasets/{dataset_id}/events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetAccepted' }
        default: { $ref: '#/components/responses/Error' }
  /datasets/connect/check:
    post:
      operationId: checkDatabase
      summary: List tables of a read-only source before connecting; nothing is stored
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceCheckRequest' }
      responses:
        '200':
          description: Reachable source (address without password) and its tables
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceCheckResult' }
        default: { $ref: '#/components/responses/Error' }
  /datasets/{dataset_id}:
    parameters:
      - { name: dataset_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDataset
      summary: Status and catalog of a dataset
      responses:
        '200':
          description: Dataset with its catalog once profiling is done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetDetail' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteDataset
      summary: Delete a dataset
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /datasets/{dataset_id}/events:
    parameters:
      - { name: dataset_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: datasetEvents
      summary: SSE progress of profiling (progress, done, error)
      responses:
        '200':
          description: Event stream; see ProfilingEvent
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/ProfilingEvent' }
  /chats:
    get:
      operationId: listChats
      parameters:
        - { name: dataset_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Chats of a dataset, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatSummary' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createChat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCreated' }
        default: { $ref: '#/components/responses/Error' }
  /chats/{chat_id}:
    parameters:
      - { name: chat_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getChat
      responses:
        '200':
          description: Chat with its messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatDetail' }
        default: { $ref: '#/components/responses/Error' }
  /chats/{chat_id}/messages:
    parameters:
      - { name: chat_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendMessage
      summary: Ask a question; the answer streams as SSE. The client never repeats this POST on its own.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
          description: Event stream; see AgentEvent
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/AgentEvent' }
        default: { $ref: '#/components/responses/Error' }
  /chats/{chat_id}/messages/{message_id}/cancel:
    parameters:
      - { name: chat_id, in: path, required: true, schema: { type: string } }
      - { name: message_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelChatTurn
      summary: Stop one owned question; a terminal outcome is returned unchanged.
      responses:
        '200':
          description: Persisted turn state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatTurnState' }
        default: { $ref: '#/components/responses/Error' }
  /results/{result_id}:
    parameters:
      - { name: result_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getResult
      summary: ToolResult metadata without rows
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolResultMeta' }
        default: { $ref: '#/components/responses/Error' }
  /results/{result_id}/data:
    parameters:
      - { name: result_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getResultData
      responses:
        '200':
          description: Columns and rows for rendering
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultData' }
        default: { $ref: '#/components/responses/Error' }
  /dashboards:
    get:
      operationId: listDashboards
      parameters:
        - { name: dataset_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Dashboards of a dataset
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DashboardSummary' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: saveToDashboard
      summary: Create a dashboard or add a chart to an existing one («+ В дашборд»)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardCreate' }
      responses:
        '200':
          description: Saved dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }
  /dashboards/{dashboard_id}:
    parameters:
      - { name: dashboard_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDashboard
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateDashboard
      summary: Rename, change layout or remove widgets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardPatch' }
      responses:
        '200':
          description: Updated dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }
  /dashboards/{dashboard_id}/refresh:
    parameters:
      - { name: dashboard_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: refreshDashboard
      summary: Re-run every widget's tool_call; widgets get new result_id
      responses:
        '200':
          description: Refreshed dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    BearerSession:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error with a user-facing message
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    UserRead:
      $ref: './contracts.json#/components/schemas/UserRead'
    UserCreate:
      $ref: './contracts.json#/components/schemas/UserCreate'
    UserLogin:
      $ref: './contracts.json#/components/schemas/UserLogin'
    TokenResponse:
      $ref: './contracts.json#/components/schemas/TokenResponse'
    AssistantMessage:
      $ref: './contracts.json#/components/schemas/AssistantMessage'
    DashboardDefinition:
      $ref: './contracts.json#/components/schemas/Dashboard'

    ErrorBody:
      $ref: './contracts.json#/components/schemas/ToolError'

    ErrorResponse:
      $ref: './contracts.json#/components/schemas/ErrorResponse'

    SourceKind:
      type: string
      enum: [csv_upload, postgres, clickhouse]
    DatasetStatus:
      type: string
      enum: [processing, ready, error]
    DatasetSource:
      $ref: './contracts.json#/components/schemas/DatasetListSource'

    DatasetSummary:
      $ref: './contracts.json#/components/schemas/DatasetSummary'

    DatasetDetail:
      $ref: './contracts.json#/components/schemas/DatasetDetail'

    DatasetAccepted:
      $ref: './contracts.json#/components/schemas/DatasetUploadAccepted'
    ConnectRequest:
      $ref: './contracts.json#/components/schemas/ConnectRequest'
    SourceCheckRequest:
      $ref: './contracts.json#/components/schemas/SourceCheckRequest'
    SourceCheckResult:
      $ref: './contracts.json#/components/schemas/SourceCheckResult'

    SemanticType:
      type: string
      enum: [id, integer, float, money, percent, datetime, date, category, text, bool]
    CatalogColumn:
      $ref: './contracts.json#/components/schemas/Column'

    CatalogTable:
      $ref: './contracts.json#/components/schemas/Table'

    ColumnRef:
      $ref: './contracts.json#/components/schemas/ColumnRef'

    Relation:
      $ref: './contracts.json#/components/schemas/Relation'

    Transformation:
      $ref: './contracts.json#/components/schemas/Transformation'

    DatasetCatalog:
      $ref: './contracts.json#/components/schemas/DatasetCatalog'

    ProfilingStep:
      type: string
      enum: [read, types, profile]
    ProfilingProgress:
      $ref: './contracts.json#/components/schemas/DatasetProgressData'

    ProfilingDone:
      $ref: './contracts.json#/components/schemas/DatasetDoneData'

    ProfilingEvent:
      description: 'Events of /datasets/{id}/events: progress → ProfilingProgress, done → ProfilingDone, error → StreamError'
      oneOf:
        - $ref: '#/components/schemas/ProfilingProgress'
        - $ref: '#/components/schemas/ProfilingDone'
        - $ref: '#/components/schemas/StreamError'

    ChartAxis:
      $ref: './contracts.json#/components/schemas/XAxis'

    ChartMeasure:
      $ref: './contracts.json#/components/schemas/YMeasure'

    ChartSpec:
      $ref: './contracts.json#/components/schemas/ChartSpec'

    ChartTemplate:
      $ref: './contracts.json#/components/schemas/ChartTemplate'

    Fact:
      $ref: './contracts.json#/components/schemas/Fact'

    ResultColumn:
      $ref: './contracts.json#/components/schemas/ToolResultColumn'

    ResultData:
      $ref: './contracts.json#/components/schemas/ToolResultData'

    ToolResultMeta:
      $ref: './contracts.json#/components/schemas/ToolResult'

    TextBlock:
      $ref: './contracts.json#/components/schemas/TextBlock'

    ChartBlock:
      $ref: './contracts.json#/components/schemas/ChartBlock'

    TableBlock:
      $ref: './contracts.json#/components/schemas/TableBlock'

    ClarificationBlock:
      $ref: './contracts.json#/components/schemas/ClarificationBlock'

    DashboardLinkBlock:
      $ref: './contracts.json#/components/schemas/DashboardLinkBlock'

    SuggestionsBlock:
      $ref: './contracts.json#/components/schemas/SuggestionsBlock'

    Block:
      $ref: './contracts.json#/components/schemas/MessageBlock'

    ChatSummary:
      $ref: './contracts.json#/components/schemas/ChatSummary'

    ChatCreate:
      $ref: './contracts.json#/components/schemas/ChatCreate'

    ChatCreated:
      $ref: './contracts.json#/components/schemas/ChatCreated'

    SendMessageRequest:
      $ref: './contracts.json#/components/schemas/SendMessageRequest'

    ChatMessage:
      $ref: './contracts.json#/components/schemas/ChatMessage'

    ChatTurnState:
      $ref: './contracts.json#/components/schemas/ChatTurnState'

    ChatDetail:
      $ref: './contracts.json#/components/schemas/ChatDetail'

    AgentStatus:
      $ref: './contracts.json#/components/schemas/SSEStatusData'

    AgentToolCall:
      $ref: './contracts.json#/components/schemas/SSEToolCallData'

    AgentToolResult:
      $ref: './contracts.json#/components/schemas/SSEToolResultData'

    AgentDone:
      $ref: './contracts.json#/components/schemas/SSEDoneData'

    AgentEvent:
      description: 'Events of POST /chats/{id}/messages: status, tool_call, tool_result, block (Block), done, error (StreamError)'
      oneOf:
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolCall'
        - $ref: '#/components/schemas/AgentToolResult'
        - $ref: '#/components/schemas/Block'
        - $ref: '#/components/schemas/AgentDone'
        - $ref: '#/components/schemas/StreamError'

    ToolCall:
      $ref: './contracts.json#/components/schemas/WidgetToolCall'

    WidgetLayout:
      $ref: './contracts.json#/components/schemas/WidgetLayout'

    Widget:
      $ref: './contracts.json#/components/schemas/WidgetSnapshot'

    DashboardSummary:
      $ref: './contracts.json#/components/schemas/DashboardSummary'

    Dashboard:
      $ref: './contracts.json#/components/schemas/DashboardSnapshot'

    DashboardCreate:
      $ref: './contracts.json#/components/schemas/DashboardCreate'

    DashboardPatch:
      $ref: './contracts.json#/components/schemas/DashboardPatch'

    StreamError:
      $ref: './contracts.json#/components/schemas/SSEErrorData'

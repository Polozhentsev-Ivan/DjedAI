name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python-enabled: ${{ steps.check.outputs.python-enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - name: Test CI checks
        run: node --test scripts/check-repository.test.mjs
      - name: Check repository
        id: check
        run: node scripts/check-repository.mjs

  python:
    name: python
    needs: repository
    if: needs.repository.outputs.python-enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - name: Install pinned Python
        run: uv python install
      - name: Restore locked environment
        run: uv sync --locked
      - name: Check Python style
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Test Python application
        run: uv run --locked pytest --strict-markers -m "not integration and not llm" --cov=src/djedai --cov-config=pyproject.toml --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  required:
    name: required
    needs: [repository, python]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - name: Require all applicable checks
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          PYTHON_EXPECTED: ${{ needs.repository.outputs.python-enabled }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: node scripts/check-repository.mjs --required

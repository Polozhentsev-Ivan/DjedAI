name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python-enabled: ${{ steps.check.outputs.python-enabled }}
      frontend-enabled: ${{ steps.check.outputs.frontend-enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Test CI checks
        run: node --test scripts/check-repository.test.mjs
      - name: Check repository
        id: check
        run: node scripts/check-repository.mjs

  python:
    name: python
    needs: repository
    if: needs.repository.outputs.python-enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - name: Install pinned Python
        run: uv python install
      - name: Restore locked environment
        run: uv sync --locked
      - name: Check Python style
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Check frontend shared contracts
        run: uv run --locked python scripts/export_frontend_contracts.py --check
      - name: Test Python application
        run: uv run --locked pytest --strict-markers -m "not integration and not llm" --cov --cov-config=pyproject.toml --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Test auth migrations and persistence
        run: uv run --locked pytest --strict-markers tests/integration/test_auth_migrations.py
      - name: Test CP1 CSV and runtime integration
        run: uv run --locked pytest --strict-markers tests/integration/test_csv_dataset_service.py tests/integration/test_csv_dataset_api.py tests/integration/test_cp1_runtime.py
      - name: Test owned read-only PostgreSQL sources against a real server
        run: uv run --locked python scripts/test_postgres_isolation.py --output "$RUNNER_TEMP/postgres-isolation.json"
      - name: Test HTTP owner isolation and session revocation
        run: uv run --locked pytest --strict-markers tests/integration/test_owner_isolation.py
      - name: Test analytical tools through protected runtime and storage
        run: uv run --locked pytest --strict-markers tests/integration/test_analytics_tools_runtime.py

  frontend:
    name: frontend
    needs: repository
    if: needs.repository.outputs.frontend-enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check pinned npm
        run: |
          expected="$(node -p "require('./package.json').engines.npm")"
          actual="$(npm --version)"
          echo "npm $actual, expected $expected"
          test "$actual" = "$expected"
      - name: Restore locked dependencies
        run: npm ci
      - name: Check generated API types
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/generated.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build

  browser:
    name: browser
    needs: repository
    if: needs.repository.outputs.frontend-enabled == 'true' && needs.repository.outputs.python-enabled == 'true'
    runs-on: ubuntu-24.04
    # Include cold Playwright system dependencies and both production image builds.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test real auth API and browser session transport
        working-directory: frontend
        env:
          DJEDAI_E2E_OUTPUT: ${{ runner.temp }}/djedai-auth
        run: npm run test:e2e:auth
      - name: Test production UI against real backend and controlled model
        working-directory: frontend
        env:
          DJEDAI_E2E_OUTPUT: ${{ runner.temp }}/djedai-playwright
        run: npm run test:e2e
      - name: Test Compose, nginx and persistent volumes with controlled model
        run: |
          cp .env.example .env
          export DJEDAI_SMOKE_USERNAME="ci-smoke-${GITHUB_RUN_ID}"
          export DJEDAI_SMOKE_PASSWORD="$(uv run --locked python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$DJEDAI_SMOKE_PASSWORD"
          uv run --locked uvicorn --app-dir tests/e2e serve_cp1:model_app --factory --host 0.0.0.0 --port 18081 > "$RUNNER_TEMP/cp1-model.log" 2>&1 &
          model_pid=$!
          cleanup() {
            docker compose -f compose.yaml -f infra/compose.test.yaml logs --no-color
            docker compose -f compose.yaml -f infra/compose.test.yaml down
            kill "$model_pid" || true
          }
          trap cleanup EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18081/openapi.json > /dev/null
          docker compose -f compose.yaml -f infra/compose.test.yaml up --build -d --wait --wait-timeout 180
          npm --prefix frontend run smoke:cp1 -- --url http://127.0.0.1:8080 --output "$RUNNER_TEMP/cp1-compose"
          docker compose -f compose.yaml -f infra/compose.test.yaml restart
          docker compose -f compose.yaml -f infra/compose.test.yaml up -d --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8080/api/health
          npm --prefix frontend run smoke:cp1 -- --url http://127.0.0.1:8080 --output "$RUNNER_TEMP/cp1-compose" --verify
      - name: Save browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cp1-browser-evidence
          path: |
            ${{ runner.temp }}/cp1-compose
            ${{ runner.temp }}/djedai-playwright
            ${{ runner.temp }}/djedai-auth
            ${{ runner.temp }}/cp1-model.log
          retention-days: 7
          if-no-files-found: warn

  required:
    name: required
    needs: [repository, python, frontend, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Require all applicable checks
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          PYTHON_EXPECTED: ${{ needs.repository.outputs.python-enabled }}
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_EXPECTED: ${{ needs.repository.outputs.frontend-enabled }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          node scripts/check-repository.mjs --required
          if [ "$PYTHON_EXPECTED" = "true" ] && [ "$FRONTEND_EXPECTED" = "true" ]; then
            test "$BROWSER_RESULT" = "success"
          else
            test "$BROWSER_RESULT" = "skipped"
          fi

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSV upload sizes are checked by the application up to MAX_UPLOAD_REQUEST_BYTES (100m).
    # Nginx enforces an outer guardrail to drop oversized payloads at the network edge.
    client_max_body_size 150m;

    location /api/ {
        # No trailing URI: preserve /api and multipart paths verbatim.
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the public edge: discard any client-supplied forwarding chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

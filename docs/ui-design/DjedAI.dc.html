<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</helmet>
<div class="{{ themeClass }}" style="height:100vh; display:flex; flex-direction:column; background:var(--background); color:var(--foreground); font-family:var(--font-sans); font-size:var(--text-sm); line-height:var(--leading-normal); letter-spacing:var(--tracking-sm); overflow:hidden">
  <sc-if value="{{ showBar }}" hint-placeholder-val="{{ true }}">
    <div style="flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-1-5) var(--space-4); padding:var(--space-1-5) var(--space-4); background:var(--surface-subtle); border-bottom:var(--border-width) solid var(--border); font-size:var(--text-xs); color:var(--muted-foreground)">
      <span style="font-weight:var(--font-weight-semibold); color:var(--foreground)">Прототип</span>
      <div style="display:flex; align-items:center; gap:var(--space-1); flex-wrap:wrap"><span style="margin-right:var(--space-1)">Экран</span>
        <sc-for list="{{ screens }}" as="i" hint-placeholder-count="5"><button onClick="{{ i.onClick }}" style="border:none; border-radius:var(--radius-full); padding:var(--space-1) var(--space-2-5); font-size:var(--text-xs); font-family:inherit; cursor:pointer; background:{{ i.bg }}; color:{{ i.ink }}; font-weight:{{ i.fw }}">{{ i.label }}</button></sc-for>
      </div>
      <div style="display:flex; align-items:center; gap:var(--space-1); flex-wrap:wrap"><span style="margin-right:var(--space-1)">Состояние</span>
        <sc-for list="{{ states }}" as="i" hint-placeholder-count="4"><button onClick="{{ i.onClick }}" style="border:none; border-radius:var(--radius-full); padding:var(--space-1) var(--space-2-5); font-size:var(--text-xs); font-family:inherit; cursor:pointer; background:{{ i.bg }}; color:{{ i.ink }}; font-weight:{{ i.fw }}">{{ i.label }}</button></sc-for>
      </div>
      <div style="display:flex; align-items:center; gap:var(--space-1)"><span style="margin-right:var(--space-1)">Тема</span>
        <sc-for list="{{ themes }}" as="i" hint-placeholder-count="2"><button onClick="{{ i.onClick }}" style="border:none; border-radius:var(--radius-full); padding:var(--space-1) var(--space-2-5); font-size:var(--text-xs); font-family:inherit; cursor:pointer; background:{{ i.bg }}; color:{{ i.ink }}; font-weight:{{ i.fw }}">{{ i.label }}</button></sc-for>
      </div>
      <div style="margin-left:auto; display:flex; gap:var(--space-4)"><a href="Frames.dc.html">Все экраны и состояния →</a><a href="Components.dc.html">Компоненты и токены →</a></div>
    </div>
  </sc-if>
  <div style="flex:1; min-height:0; display:flex; flex-direction:column">
    <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ false }}"><div style="flex:1; min-height:0; position:relative"><dc-import name="LoginPage" state="{{ loginState }}" on-submit="{{ onLogin }}" hint-size="100%,100%"></dc-import></div></sc-if>
    <sc-if value="{{ isApp }}" hint-placeholder-val="{{ true }}"><div style="flex:1; min-height:0; position:relative"><dc-import name="AppLayout" page="{{ page }}" state="{{ appState }}" theme="{{ theme }}" on-page-change="{{ onPageChange }}" on-state-change="{{ onStateChange }}" on-logout="{{ onLogout }}" hint-size="100%,100%"></dc-import></div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;sources&quot;,&quot;catalog&quot;,&quot;chat&quot;,&quot;dashboards&quot;],&quot;default&quot;:&quot;sources&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showReviewBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { screen: this.props.startScreen ?? 'sources', vs: {}, theme: null };
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const s = this.state, theme = s.theme ?? this.props.theme ?? 'light', scr = s.screen, v = s.vs[scr] || 'default';
    const pill = on => ({ bg: on ? 'var(--card)' : 'transparent', ink: on ? 'var(--foreground)' : 'var(--muted-foreground)', fw: on ? 'var(--font-weight-semibold)' : 'var(--font-weight-regular)' });
    const setV = (k, val) => this.setState(x => ({ vs: { ...x.vs, [k]: val } }));
    return {
      themeClass: theme === 'dark' ? 'dark' : '', theme, showBar: this.props.showReviewBar ?? true,
      screens: [['login', 'Вход'], ['sources', 'Источники'], ['catalog', 'Каталог'], ['chat', 'Чат'], ['dashboards', 'Дашборды']].map(([k, l]) => ({ label: l, ...pill(scr === k), onClick: () => this.setState({ screen: k }) })),
      states: [['default', 'Данные'], ['loading', 'Ожидание'], ['empty', 'Пусто'], ['error', 'Ошибка']].map(([k, l]) => ({ label: l, ...pill(v === k), onClick: () => setV(scr, k) })),
      themes: [['light', 'Светлая'], ['dark', 'Тёмная']].map(([k, l]) => ({ label: l, ...pill(theme === k), onClick: () => this.setState({ theme: k }) })),
      isLogin: scr === 'login', isApp: scr !== 'login', page: scr === 'login' ? 'sources' : scr, appState: v, loginState: v,
      onLogin: () => { setV('login', 'loading'); clearTimeout(this.t); this.t = setTimeout(() => this.setState(x => ({ screen: 'sources', vs: { ...x.vs, login: 'default' } })), 1200); },
      onPageChange: (page) => this.setState({ screen: page }),
      onStateChange: (val) => setV(this.state.screen, val),
      onLogout: () => this.setState({ screen: 'login' })
    };
  }
}
</script>
</body>
</html>

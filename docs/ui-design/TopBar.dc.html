<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<header data-component="TopBar" style="flex:none; height:var(--topbar-height); box-sizing:border-box; background:var(--topbar); color:var(--topbar-foreground); display:flex; align-items:center; gap:var(--space-5); padding:var(--space-0) var(--space-5); font-family:var(--font-sans); font-size:var(--text-xs); letter-spacing:var(--tracking-xs); position:relative; z-index:30">
  <div onClick="{{ onHome }}" style="font-family:var(--font-display); font-size:var(--text-base); font-weight:var(--font-weight-semibold); letter-spacing:var(--tracking-body); cursor:pointer">DjedAI</div>
  <dc-import name="DatasetSelect" value="{{ dataset }}" options="{{ datasets }}" show-label="{{ wide }}" on-change="{{ onDatasetChange }}" on-add="{{ onAddSource }}" hint-size="260px,30px"></dc-import>
  <div style="flex:1"></div>
  <span style="color:var(--topbar-muted)">Пользователь: <span style="color:var(--topbar-foreground)">{{ user }}</span></span>
  <a onClick="{{ onLogout }}" style="display:flex; align-items:center; gap:var(--space-1); color:var(--topbar-link)"><dc-import name="Icon" icon="log-out" size="var(--size-icon-xs)" hint-size="12px,12px"></dc-import>Выйти</a>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:300},&quot;dataset&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;orders_2026&quot;,&quot;tsType&quot;:&quot;string | null&quot;},&quot;user&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ivan&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;datasets&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;id&quot;:&quot;orders_2026&quot;,&quot;meta&quot;:&quot;CSV (2) · 120 450 строк&quot;},{&quot;id&quot;:&quot;retail_crm_prod&quot;,&quot;meta&quot;:&quot;Postgres · 1 420 000 строк&quot;}],&quot;tsType&quot;:&quot;DatasetOption[]&quot;},&quot;onHome&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onDatasetChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;},&quot;onAddSource&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onLogout&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { dataset: p.dataset, datasets: p.datasets || [], wide: !(p.compact ?? false), user: p.user ?? 'ivan',
      onHome: p.onHome, onDatasetChange: p.onDatasetChange, onAddSource: p.onAddSource, onLogout: p.onLogout };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<div data-component="DataTable" style="overflow-x:auto; font-family:var(--font-sans); font-size:var(--text-sm); line-height:var(--leading-normal); letter-spacing:var(--tracking-sm); color:var(--foreground)">
  <div style="min-width:{{ minWidth }}">
    <div style="display:grid; grid-template-columns:{{ grid }}; gap:var(--space-4); padding:var(--space-2-5) var(--space-5); font-size:var(--text-xs); font-weight:var(--font-weight-semibold); color:var(--muted-foreground); border-bottom:var(--border-width) solid var(--border)">
      <sc-for list="{{ head }}" as="h" hint-placeholder-count="5"><span style="text-align:{{ h.align }}">{{ h.label }}</span></sc-for>
    </div>
    <sc-for list="{{ body }}" as="row" hint-placeholder-count="3">
      <div style="display:grid; grid-template-columns:{{ grid }}; gap:var(--space-4); align-items:center; padding:var(--space-3) var(--space-5); border-bottom:var(--border-width) solid var(--border-subtle); background:{{ row.bg }}">
        <sc-for list="{{ row.cells }}" as="c" hint-placeholder-count="5">
          <div style="min-width:0; text-align:{{ c.align }}">
            <sc-if value="{{ c.isText }}"><span style="color:{{ c.ink }}; font-weight:{{ c.fw }}; font-family:{{ c.ff }}; font-size:{{ c.fs }}; font-variant-numeric:tabular-nums; white-space:{{ c.ws }}">{{ c.text }}</span></sc-if>
            <sc-if value="{{ c.isName }}"><span style="display:inline-flex; flex-wrap:wrap; align-items:center; gap:var(--space-2)"><span style="font-family:var(--font-mono); font-weight:var(--font-weight-semibold)">{{ c.text }}</span><sc-if value="{{ c.hasTag }}"><dc-import name="StatusBadge" variant="tag" tone="accent" label="{{ c.tag }}" hint-size="64px,20px"></dc-import></sc-if></span></sc-if>
            <sc-if value="{{ c.isBadge }}"><dc-import name="StatusBadge" tone="{{ c.tone }}" label="{{ c.text }}" variant="{{ c.variant }}" hint-size="80px,22px"></dc-import></sc-if>
            <sc-if value="{{ c.isActions }}"><div style="display:flex; flex-wrap:wrap; gap:var(--space-1) var(--space-4)"><sc-for list="{{ c.items }}" as="a"><a onClick="{{ a.onClick }}" style="color:{{ a.ink }}">{{ a.label }}</a></sc-for></div></sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:240},&quot;columns&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{key:string; label:string; type?:'text'|'strong'|'mono'|'number'|'muted'|'name'|'badge'|'type'|'actions'; align?:'left'|'right'; width?:string}[]&quot;,&quot;default&quot;:[{&quot;key&quot;:&quot;a&quot;,&quot;label&quot;:&quot;Название&quot;,&quot;type&quot;:&quot;name&quot;,&quot;width&quot;:&quot;2fr&quot;},{&quot;key&quot;:&quot;b&quot;,&quot;label&quot;:&quot;Статус&quot;,&quot;type&quot;:&quot;badge&quot;}]},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, string | {text:string; tone?:string; tag?:string} | {label:string; onClick:()=&gt;void; tone?:string}[]&gt; &amp; {highlight?:boolean}&quot;,&quot;default&quot;:[{&quot;a&quot;:{&quot;text&quot;:&quot;orders_2026&quot;,&quot;tag&quot;:&quot;активный&quot;},&quot;b&quot;:{&quot;text&quot;:&quot;Готов&quot;,&quot;tone&quot;:&quot;success&quot;},&quot;highlight&quot;:true}]},&quot;minWidth&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cols = this.props.columns || [], rows = this.props.rows || [];
    const toneInk = { muted: 'var(--muted-foreground)', warning: 'var(--warning)', danger: 'var(--destructive)', success: 'var(--success)', secondary: 'var(--secondary-foreground)' };
    const body = rows.map(r => ({
      bg: r.highlight ? 'var(--secondary)' : 'transparent',
      cells: cols.map(col => {
        const raw = r[col.key], v = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : { text: raw };
        const t = col.type || 'text';
        return {
          align: col.align || 'left', text: v.text ?? '',
          isText: ['text', 'strong', 'mono', 'number', 'muted'].includes(t), isName: t === 'name', isBadge: t === 'badge' || t === 'type', isActions: t === 'actions',
          ink: toneInk[v.tone] || (t === 'mono' ? 'var(--muted-foreground)' : t === 'muted' ? 'var(--secondary-foreground)' : 'var(--foreground)'),
          fw: t === 'strong' || v.strong ? 'var(--font-weight-semibold)' : 'var(--font-weight-regular)',
          ff: t === 'mono' ? 'var(--font-mono)' : 'inherit', fs: t === 'mono' ? 'var(--text-xs)' : 'var(--text-sm)',
          ws: t === 'number' ? 'nowrap' : 'normal',
          tag: v.tag, hasTag: !!v.tag, tone: v.tone || 'neutral', variant: t === 'type' ? 'type' : 'status',
          items: t === 'actions' ? (raw || []).map(a => ({ label: a.label, onClick: a.onClick, ink: toneInk[a.tone] || 'var(--link)' })) : []
        };
      })
    }));
    return {
      head: cols.map(c => ({ label: c.label, align: c.align || 'left' })), body,
      grid: cols.map(c => c.width || 'minmax(0,1fr)').join(' '), minWidth: this.props.minWidth || '0'
    };
  }
}
</script>
</body>
</html>

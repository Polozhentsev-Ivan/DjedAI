<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<div data-component="TransformLogItem" style="display:flex; gap:var(--space-3); padding:var(--space-3) var(--space-5); border-bottom:var(--border-width) solid var(--border-subtle); background:{{ bg }}; font-family:var(--font-sans); font-size:var(--text-sm); line-height:var(--leading-normal); letter-spacing:var(--tracking-sm); color:var(--foreground)">
  <span style="flex:none; display:flex; align-items:center; justify-content:center; width:var(--size-log-icon); height:var(--size-log-icon); color:{{ ink }}"><dc-import name="Icon" icon="{{ icon }}" size="var(--size-icon)" stroke-width="{{ 2 }}" hint-size="18px,18px"></dc-import></span>
  <div style="display:flex; flex-direction:column; gap:var(--space-0-5); min-width:0">
    <span style="font-size:var(--text-xs); font-weight:var(--font-weight-semibold); color:{{ tagInk }}">{{ tag }}</span>
    <span style="text-wrap:pretty">{{ text }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:90},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;info&quot;,&quot;warning&quot;],&quot;default&quot;:&quot;info&quot;,&quot;tsType&quot;:&quot;'info'|'warning'&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;В колонке «Сумма с НДС, руб» распознан формат валюты (₽)&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const warn = (this.props.level ?? 'info') === 'warning';
    return {
      text: this.props.text ?? '', icon: warn ? 'triangle-alert' : 'info', tag: warn ? 'Предупреждение' : 'Информация',
      ink: warn ? 'var(--warning)' : 'var(--link)', tagInk: warn ? 'var(--warning)' : 'var(--muted-foreground)',
      bg: warn ? 'var(--warning-muted)' : 'transparent'
    };
  }
}
</script>
</body>
</html>

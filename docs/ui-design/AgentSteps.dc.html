<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<div data-component="AgentSteps" style="display:flex; flex-direction:column; gap:var(--space-2); padding:{{ pad }}; border:{{ bd }}; border-radius:var(--radius-md); background:{{ bg }}; width:100%; box-sizing:border-box; font-family:var(--font-sans); font-size:var(--text-sm); line-height:var(--leading-normal); letter-spacing:var(--tracking-sm); color:var(--foreground)">
  <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; align-items:center; gap:var(--space-2); font-weight:var(--font-weight-semibold)">
      <span style="color:var(--primary); display:flex"><dc-import name="Icon" icon="loader-circle" spin="{{ true }}" size="var(--size-icon-sm)" hint-size="16px,16px"></dc-import></span>
      <span>{{ title }}</span>
    </div>
  </sc-if>
  <sc-for list="{{ items }}" as="st" hint-placeholder-count="3">
    <div style="display:flex; flex-direction:column; gap:var(--space-1-5)">
      <div style="display:flex; align-items:center; gap:var(--space-2); color:{{ st.ink }}">
        <span style="display:flex; color:{{ st.iconInk }}"><dc-import name="Icon" icon="{{ st.icon }}" spin="{{ st.isActive }}" size="var(--size-icon-sm)" hint-size="16px,16px"></dc-import></span>
        <span>{{ st.label }}</span>
        <sc-if value="{{ st.hasPct }}"><span style="margin-left:auto; font-variant-numeric:tabular-nums; color:var(--secondary-foreground)">{{ st.pctLabel }}</span></sc-if>
      </div>
      <sc-if value="{{ st.hasPct }}"><div style="height:var(--size-progress); border-radius:var(--radius-full); background:var(--muted); margin-left:var(--space-6); overflow:hidden"><div style="height:100%; width:{{ st.pctLabel }}; background:var(--primary); border-radius:var(--radius-full)"></div></div></sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:160},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ассистент работает&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;framed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;steps&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;label&quot;:&quot;Анализирую данные…&quot;,&quot;status&quot;:&quot;active&quot;},{&quot;label&quot;:&quot;Считаю агрегаты…&quot;,&quot;status&quot;:&quot;pending&quot;}],&quot;tsType&quot;:&quot;{label:string; status:'done'|'active'|'pending'; pct?:number}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const framed = this.props.framed ?? true;
    const items = (this.props.steps || []).map(st => ({
      label: st.label, isActive: st.status === 'active',
      icon: st.status === 'done' ? 'check' : st.status === 'active' ? 'loader-circle' : 'circle',
      iconInk: st.status === 'done' ? 'var(--success)' : st.status === 'active' ? 'var(--primary)' : 'var(--muted-foreground)',
      ink: st.status === 'pending' ? 'var(--muted-foreground)' : 'var(--foreground)',
      hasPct: st.pct != null, pctLabel: (st.pct ?? 0) + '%'
    }));
    return {
      items, title: this.props.title ?? '', hasTitle: framed && !!this.props.title,
      pad: framed ? 'var(--space-3-5) var(--space-4)' : 'var(--space-0)', bd: framed ? 'var(--border-width) solid var(--border)' : 'none',
      bg: framed ? 'var(--secondary)' : 'transparent'
    };
  }
}
</script>
</body>
</html>
